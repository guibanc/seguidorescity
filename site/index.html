<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1824">
  <title>A Cidade dos Seguidores</title>
  <meta name="description" content="Acompanhe a vila em 16 bits ao vivo, escolha um morador, coloque seu nome nele e personalize.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23d63838' d='M2 7l6-5 6 5v1H2z'/%3E%3Cpath fill='%23fff8e7' d='M3 8h10v6H3z'/%3E%3Cpath fill='%2370452a' d='M7 10h2v4H7z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="mapa" aria-label="Mapa da vila"></canvas>

  <!-- topo: nome da vila, números, relógio, próximo marco -->
  <header id="hud">
    <div class="hud-linha">
      <div class="hud-titulo">
        <span class="hud-ep" id="hudEp">EP 3</span>
        <h1 id="hudNome">A Cidade dos Seguidores</h1>
      </div>
      <button class="hud-relogio" id="btnRelogio" aria-label="Relógio da vila">
        <span id="hudIcone">☀️</span><span id="hudHora">--:--</span><span class="hud-vel" id="hudVel"></span>
      </button>
    </div>
    <div class="hud-linha hud-numeros">
      <span class="chip chip-vivo" id="hudVivoChip" hidden><i class="ponto-vivo"></i><b id="hudVivo">–</b> seguidores agora</span>
      <span class="chip chip-chegando" id="hudChegandoChip" hidden><b id="hudChegando">–</b> chegando no próximo ep.</span>
      <span class="chip"><b id="hudMoradores">–</b> moradores</span>
      <span class="chip"><b id="hudCasas">–</b> casas</span>
      <span class="chip chip-reg"><b id="hudReg">–</b> com nome</span>
      <span class="chip chip-livre"><b id="hudLivres">–</b> livres</span>
    </div>
    <div class="marco" id="hudMarco">
      <div class="marco-barra"><div class="marco-enche" id="hudMarcoBarra"></div></div>
      <span id="hudMarcoTxt">…</span>
    </div>
    <!-- vida do meu morador (só logado) -->
    <div id="vida" hidden>
      <canvas id="vidaAvatar" width="12" height="15"></canvas>
      <div class="vida-info">
        <span class="vida-nome" id="vidaNome"></span>
        <div class="vida-linha">
          <svg class="vida-coracao" viewBox="0 0 9 8" aria-hidden="true"><path d="M1 0h2v1h1v1h1V1h1V0h2v1h1v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1h1z" fill="#1e1824"/><path d="M1 1h2v1h1v1h1V2h1V1h2v3H7v1H6v1H5v1H4V6H3V5H2V4H1z" fill="#ff4d6d"/><path d="M2 2h1v1H2z" fill="#ffd0da"/></svg>
          <div class="vida-barra" role="progressbar" aria-label="Vida" aria-valuemin="0" aria-valuemax="100"><div class="vida-enche" id="vidaEnche"></div></div>
          <b id="vidaPct">100%</b>
        </div>
      </div>
    </div>
  </header>

  <!-- mover meu boneco (só logado) -->
  <button id="btnJogar" hidden>🎮 Mover meu boneco</button>
  <div id="joystick" hidden><div id="joyBase"><div id="joyPino"></div></div></div>
  <div id="dicaTeclas" hidden><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ou setas pra andar · <kbd>Esc</kbd> pra parar</div>

  <!-- controles do relógio -->
  <div id="relogioPainel" class="flutuante" hidden>
    <p class="mini">A vila segue a hora de Brasília. Quer ver como fica em outro horário?</p>
    <div class="linha-botoes">
      <button data-vel="1" class="btn-chip">Ao vivo</button>
      <button data-vel="60" class="btn-chip">1 min = 1 h</button>
      <button data-vel="600" class="btn-chip">Super rápido</button>
    </div>
    <div class="linha-botoes">
      <button data-pula="-60" class="btn-chip">−1 h</button>
      <button data-pula="60" class="btn-chip">+1 h</button>
      <button data-pula="360" class="btn-chip">+6 h</button>
    </div>
  </div>

  <!-- zoom -->
  <div id="zoom">
    <button id="zoomMais" aria-label="Aproximar">+</button>
    <button id="zoomMenos" aria-label="Afastar">−</button>
    <button id="zoomMeu" aria-label="Ir até meu morador" hidden>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
  </div>

  <!-- aviso de modo "escolher no mapa" -->
  <div id="avisoEscolher" class="aviso" hidden>
    <span>Toque num morador no mapa</span>
    <button id="avisoCancelar">Cancelar</button>
  </div>

  <!-- painel (bottom sheet no celular, lateral no PC) -->
  <section id="painel" aria-live="polite" hidden>
    <div class="painel-alca" id="painelAlca"><span></span></div>
    <div class="painel-topo">
      <button class="painel-voltar" id="painelVoltar" aria-label="Voltar" hidden>‹</button>
      <h2 id="painelTitulo"></h2>
      <button class="painel-fechar" id="painelFechar" aria-label="Fechar">×</button>
    </div>
    <div class="painel-corpo" id="painelCorpo"></div>
  </section>

  <!-- barra de menu -->
  <nav id="menu">
    <button data-aba="buscar"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Buscar</span></button>
    <button data-aba="moradores"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.8 3.2-6 6.5-6s5.9 2.2 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.9.1 4.8 2 5.5 5.3"/></svg><span>Moradores</span></button>
    <button data-aba="registrar" class="menu-destaque"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="menuRegTxt">Registrar</span></button>
    <button data-aba="eu"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.4 4-7 8-7s7.2 2.6 8 7"/></svg><span id="menuEuTxt">Entrar</span></button>
  </nav>

  <div id="toast" role="status"></div>
  <div id="carregando"><div class="carregando-caixa">Carregando a vila…</div></div>

  <script src="config.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
